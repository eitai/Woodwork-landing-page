<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- apply saved accessibility preferences before paint (no flash) -->
    <script>
      try {
        var a = JSON.parse(localStorage.getItem("idb.a11y") || "{}"),
          r = document.documentElement;
        if (a.font) r.setAttribute("data-a11y-font", String(a.font));
        if (a.contrast) r.setAttribute("data-a11y-contrast", "on");
        if (a.motion) r.setAttribute("data-a11y-motion", "off");
        if (a.links) r.setAttribute("data-a11y-links", "on");
      } catch (e) {}
    </script>

    <title>IDB — פרגולות ודקים בהתאמה אישית</title>
    <meta
      name="description"
      content="IDB — תכנון ובניית פרגולות ודקים בהתאמה אישית. נגרות מדויקת, חומרים עמידים וגימור מוקפד, מהשרטוט ועד המבנה המוגמר."
    />
    <meta name="theme-color" content="#2A1E15" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:title" content="IDB — פרגולות ודקים בהתאמה אישית" />
    <meta
      property="og:description"
      content="מהשרטוט ועד הצל. פרגולות ודקים בהתאמה אישית — תכנון, נגרות מדויקת וחומרים עמידים."
    />
    <meta property="og:image" content="/seq/loop/poster.webp" />

    <!-- Fonts (Hebrew): Frank Ruhl Libre (display), Assistant (body), IBM Plex Mono (spec).
         Self-hosted — no third-party request, no cookies, no IP leak to Google. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/assistant-400-hebrew.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/frankruhl-900-hebrew.woff2" crossorigin />

    <!-- Prime the loop poster (first thing visible); frame tier is chosen at
         runtime by connection speed (src/tier.ts), so frames aren't preloaded here -->
    <link rel="preload" as="image" href="/seq/loop/poster.webp" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "@id": "https://idb.co.il/#business",
        "name": "IDB — פרגולות ודקים",
        "description": "תכנון ובניית פרגולות ודקים בהתאמה אישית: נגרות מדויקת, חומרים עמידים וגימור מוקפד.",
        "image": "https://idb.co.il/seq/loop/poster.webp",
        "url": "https://idb.co.il/",
        "areaServed": { "@type": "Country", "name": "IL" },
        "makesOffer": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "בניית פרגולות בהתאמה אישית",
              "serviceType": "פרגולות עץ"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "בניית דקים",
              "serviceType": "דקי עץ"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
